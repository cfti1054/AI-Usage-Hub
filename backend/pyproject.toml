[project]
name = "ai-usage-hub-backend"
version = "0.1.0"
description = "AI 사용량 통합 대시보드 백엔드 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "pyjwt>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
